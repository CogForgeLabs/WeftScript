name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The project pins nightly via rust-toolchain.toml (portable_simd).
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Linux build deps for the wgpu (GPU) backend; no GPU is needed to build.
      - name: Linux deps for wgpu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      # Advisory only — the codebase uses a deliberate wide hand-format style.
      - name: Format check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Build (workspace)
        run: cargo build --workspace --verbose

      - name: Test (workspace)
        run: cargo test --workspace --verbose --no-fail-fast
